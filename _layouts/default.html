<!DOCTYPE html>
<html lang="{{ site.lang | default: "ja" }}">

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width,maximum-scale=2">
    <title>{{ site.title }} - {{ page.title }}</title>
    <style>
    body{
      margin: 3rem 1.5rem;
      font-family: "Klee", "クレー", "YuMincho", "游明朝", serif;
      font-size: 1.05rem;
    }
    img{
      max-width:100%;
      height:auto;
      max-height:90vh;
      border-radius: 3px;
      }
    a[rel*="noopener"]::after{
      content: "↗︎";
    }
    h1,h2,h3{
      text-wrap: balance;
    }
  </style>
  </head>
  <body>
        {{ content }}
  </body>
</html>
